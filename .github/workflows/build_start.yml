name: Build Start - Provision and First Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "ci/**"
    paths:
      - "terraform/**"
      - "backend/**"
      - "frontend/**"
      - "k8s/**"
      - ".github/workflows/build_start.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: build-start-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_ENV_DIR: terraform/environments/dev

jobs:
  provision-and-first-deploy:
    name: Provision Infrastructure and Deploy App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Generate Terraform backend and tfvars
        working-directory: ${{ env.TF_ENV_DIR }}
        run: |
          set -euo pipefail

          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          cat > backend.tf <<EOF_BACKEND
          terraform {
            backend "s3" {
              bucket       = "${{ vars.TF_STATE_BUCKET }}"
              key          = "${{ vars.TF_STATE_KEY }}"
              region       = "${{ vars.AWS_REGION }}"
              encrypt      = true
              use_lockfile = true
            }
          }
          EOF_BACKEND

          cat > terraform.tfvars <<EOF_TFVARS
          project_name = "${{ vars.PROJECT_NAME }}"
          env_name     = "${{ vars.ENV_NAME }}"
          aws_region   = "${{ vars.AWS_REGION }}"

          github_owner  = "${{ github.repository_owner }}"
          github_repo   = "$REPO_NAME"
          github_branch = "${{ github.ref_name }}"

          github_actions_infra_role_arn = "${{ vars.AWS_INFRA_ROLE_ARN }}"
          EOF_TFVARS

      - name: Terraform fmt check
        run: terraform -chdir=${{ env.TF_ENV_DIR }} fmt -check -recursive

      - name: Terraform init
        run: terraform -chdir=${{ env.TF_ENV_DIR }} init -reconfigure

      - name: Terraform validate
        run: terraform -chdir=${{ env.TF_ENV_DIR }} validate

      - name: Terraform plan
        run: terraform -chdir=${{ env.TF_ENV_DIR }} plan -out=tfplan

      - name: Terraform apply
        run: terraform -chdir=${{ env.TF_ENV_DIR }} apply -auto-approve tfplan

      - name: Read Terraform outputs
        id: tfout
        run: |
          set -euo pipefail

          EKS_CLUSTER_NAME="$(terraform -chdir=${{ env.TF_ENV_DIR }} output -raw eks_cluster_name)"
          BACKEND_ECR_URL="$(terraform -chdir=${{ env.TF_ENV_DIR }} output -json ecr_repository_urls | jq -r '.backend')"
          FRONTEND_ECR_URL="$(terraform -chdir=${{ env.TF_ENV_DIR }} output -json ecr_repository_urls | jq -r '.frontend')"

          echo "eks_cluster_name=$EKS_CLUSTER_NAME" >> "$GITHUB_OUTPUT"
          echo "backend_ecr_url=$BACKEND_ECR_URL" >> "$GITHUB_OUTPUT"
          echo "frontend_ecr_url=$FRONTEND_ECR_URL" >> "$GITHUB_OUTPUT"

          echo "EKS cluster: $EKS_CLUSTER_NAME"
          echo "Backend ECR: $BACKEND_ECR_URL"
          echo "Frontend ECR: $FRONTEND_ECR_URL"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          set -euo pipefail

          BACKEND_IMAGE="${{ steps.tfout.outputs.backend_ecr_url }}:${GITHUB_SHA}"
          BACKEND_LATEST="${{ steps.tfout.outputs.backend_ecr_url }}:latest"

          docker build \
            -t "$BACKEND_IMAGE" \
            -t "$BACKEND_LATEST" \
            ./backend

          docker push "$BACKEND_IMAGE"
          docker push "$BACKEND_LATEST"

          echo "BACKEND_IMAGE=$BACKEND_IMAGE" >> "$GITHUB_ENV"

      - name: Build and push frontend image
        run: |
          set -euo pipefail

          FRONTEND_IMAGE="${{ steps.tfout.outputs.frontend_ecr_url }}:${GITHUB_SHA}"
          FRONTEND_LATEST="${{ steps.tfout.outputs.frontend_ecr_url }}:latest"

          docker build \
            -t "$FRONTEND_IMAGE" \
            -t "$FRONTEND_LATEST" \
            ./frontend

          docker push "$FRONTEND_IMAGE"
          docker push "$FRONTEND_LATEST"

          echo "FRONTEND_IMAGE=$FRONTEND_IMAGE" >> "$GITHUB_ENV"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --name "${{ steps.tfout.outputs.eks_cluster_name }}" \
            --region "${{ vars.AWS_REGION }}"

          kubectl version --client
          kubectl get nodes

      - name: Ensure namespace exists
        run: |
          kubectl get namespace "${{ vars.K8S_NAMESPACE }}" >/dev/null 2>&1 || \
          kubectl create namespace "${{ vars.K8S_NAMESPACE }}"

      - name: Sync Kubernetes runtime secret
        run: |
          set -euo pipefail

          SECRET_JSON="$(aws secretsmanager get-secret-value \
            --secret-id "${{ vars.SECRET_NAME }}" \
            --region "${{ vars.AWS_REGION }}" \
            --query SecretString \
            --output text)"

          OPENAI_API_KEY="$(echo "$SECRET_JSON" | jq -r '.OPENAI_API_KEY')"
          DATABASE_URL="$(echo "$SECRET_JSON" | jq -r '.DATABASE_URL')"

          test "$OPENAI_API_KEY" != "null"
          test "$DATABASE_URL" != "null"

          kubectl -n "${{ vars.K8S_NAMESPACE }}" create secret generic "${{ vars.K8S_SECRET_NAME }}" \
            --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Install envsubst
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gettext-base

      - name: Deploy Kubernetes manifests
        run: |
          set -euo pipefail

          export K8S_NAMESPACE="${{ vars.K8S_NAMESPACE }}"
          export K8S_SECRET_NAME="${{ vars.K8S_SECRET_NAME }}"
          export BACKEND_IMAGE="$BACKEND_IMAGE"
          export FRONTEND_IMAGE="$FRONTEND_IMAGE"

          envsubst < k8s/namespace.yaml | kubectl apply -f -
          envsubst < k8s/backend-service.yaml | kubectl apply -f -
          envsubst < k8s/frontend-service.yaml | kubectl apply -f -
          envsubst < k8s/backend-deployment.yaml | kubectl apply -f -
          envsubst < k8s/frontend-deployment.yaml | kubectl apply -f -

      - name: Force deployment images
        run: |
          set -euo pipefail

          kubectl -n "${{ vars.K8S_NAMESPACE }}" set image deployment/cook-with-me-backend \
            '*='"$BACKEND_IMAGE"

          kubectl -n "${{ vars.K8S_NAMESPACE }}" set image deployment/cook-with-me-frontend \
            '*='"$FRONTEND_IMAGE"

      - name: Wait for rollout
        run: |
          set -euo pipefail

          kubectl -n "${{ vars.K8S_NAMESPACE }}" rollout status deployment/cook-with-me-backend --timeout=300s
          kubectl -n "${{ vars.K8S_NAMESPACE }}" rollout status deployment/cook-with-me-frontend --timeout=300s

      - name: Debug Kubernetes failure
        if: failure()
        run: |
          set +e

          echo "=== Kubernetes resources ==="
          kubectl -n "${{ vars.K8S_NAMESPACE }}" get all -o wide

          echo
          echo "=== Pods ==="
          kubectl -n "${{ vars.K8S_NAMESPACE }}" get pods -o wide

          echo
          echo "=== Backend logs ==="
          kubectl -n "${{ vars.K8S_NAMESPACE }}" logs deployment/cook-with-me-backend --all-containers=true --tail=150

          echo
          echo "=== Frontend logs ==="
          kubectl -n "${{ vars.K8S_NAMESPACE }}" logs deployment/cook-with-me-frontend --all-containers=true --tail=150

          echo
          echo "=== Describe backend pods ==="
          for pod in $(kubectl -n "${{ vars.K8S_NAMESPACE }}" get pods -l app=cook-with-me-backend -o jsonpath='{.items[*].metadata.name}'); do
            echo "--- $pod ---"
            kubectl -n "${{ vars.K8S_NAMESPACE }}" describe pod "$pod"
          done

          echo
          echo "=== Describe frontend pods ==="
          for pod in $(kubectl -n "${{ vars.K8S_NAMESPACE }}" get pods -l app=cook-with-me-frontend -o jsonpath='{.items[*].metadata.name}'); do
            echo "--- $pod ---"
            kubectl -n "${{ vars.K8S_NAMESPACE }}" describe pod "$pod"
          done

          echo
          echo "=== Recent namespace events ==="
          kubectl -n "${{ vars.K8S_NAMESPACE }}" get events --sort-by='.lastTimestamp' | tail -80
          
      - name: Print Kubernetes resources
        if: always()
        run: |
          kubectl -n "${{ vars.K8S_NAMESPACE }}" get pods -o wide || true
          kubectl -n "${{ vars.K8S_NAMESPACE }}" get svc -o wide || true
          kubectl -n "${{ vars.K8S_NAMESPACE }}" get deploy -o wide || true

      - name: Print frontend URL
        run: |
          set -euo pipefail

          echo "Waiting for frontend LoadBalancer hostname..."

          HOST=""
          for i in {1..30}; do
            HOST="$(kubectl -n "${{ vars.K8S_NAMESPACE }}" get svc cook-with-me-frontend \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"

            if [ -n "$HOST" ]; then
              break
            fi

            echo "Still waiting... attempt $i/30"
            sleep 10
          done

          if [ -z "$HOST" ]; then
            echo "Frontend LoadBalancer hostname is not ready yet."
            kubectl -n "${{ vars.K8S_NAMESPACE }}" get svc cook-with-me-frontend -o wide
            exit 1
          fi

          echo "Frontend URL: http://$HOST"
