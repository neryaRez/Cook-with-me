apiVersion: apps/v1
kind: Deployment
metadata:
  name: cook-with-me-frontend
  namespace: cook-with-me
  labels:
    app: cook-with-me-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cook-with-me-frontend
  template:
    metadata:
      labels:
        app: cook-with-me-frontend
    spec:
      containers:
        - name: frontend
          image: ${FRONTEND_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
