apiVersion: apps/v1
kind: Deployment
metadata:
  name: cook-with-me-backend
  namespace: cook-with-me
  labels:
    app: cook-with-me-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cook-with-me-backend
  template:
    metadata:
      labels:
        app: cook-with-me-backend
    spec:
      containers:
        - name: backend
          image: ${BACKEND_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: FLASK_ENV
              value: "production"
          envFrom:
            - secretRef:
                name: cook-with-me-backend-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
